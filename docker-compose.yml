services:
  db:
    container_name: nest_turbo_db
    extends:
      file: .docker/compose/postgresql/postgresql.yml
      service: postgresql
    ports:
      - '5534:5432'
    volumes:
      - ${PWD}/.docker/volumes/pgdata:/var/lib/postgresql/data
    networks:
      - nest-turbo-network
    environment:
      POSTGRES_USER: ${DEFAULT_PG_USER}
      POSTGRES_PASSWORD: ${DEFAULT_PG_PASSWORD}
      POSTGRES_DB: ${DEFAULT_PG_DATABASE}
    env_file:
      - .env

  redis:
    container_name: nest_turbo_redis
    extends:
      file: .docker/compose/redis/redis.yml
      service: redis
    ports:
      - '6374:6379'
    networks:
      - nest-turbo-network
    volumes:
      - ${PWD}/.docker/volumes/redis_data:/data
    command: redis-server --appendonly yes --dir /data

  redisinsight:
    container_name: nest_turbo_redisinsight
    extends:
      file: .docker/compose/redis/redis.yml
      service: redisinsight
    depends_on:
      - redis
    volumes:
      - ${PWD}/.docker/volumes/redisinsight_data:/db
    ports:
      - '5544:5540'
    links:
      - redis
    networks:
      - nest-turbo-network

