  auth-service:
    container_name: nest_turbo_auth_service
    build:
      context: .
      dockerfile: .docker/compose/nodejs/Dockerfile
      args:
        SERVICE: auth-service
    ports:
      - '${AUTH_SERVICE_APP_PORT:-3301}:${AUTH_SERVICE_APP_PORT:-3301}'
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - nest-turbo-network

  user-service:
    container_name: nest_turbo_user_service
    build:
      context: .
      dockerfile: .docker/compose/nodejs/Dockerfile
      args:
        SERVICE: user-service
    ports:
      - '${USER_SERVICE_APP_PORT:-3302}:${USER_SERVICE_APP_PORT:-3302}'
      - '${GRPC_USER_SERVICE_PORT:-3311}:${GRPC_USER_SERVICE_PORT:-3311}'
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - nest-turbo-network

  notification-service:
    container_name: nest_turbo_notification_service
    build:
      context: .
      dockerfile: .docker/compose/nodejs/Dockerfile
      args:
        SERVICE: notification-service
    ports:
      - '${NOTIFICATION_SERVICE_APP_PORT:-3303}:${NOTIFICATION_SERVICE_APP_PORT:-3303}'
      - '${GRPC_NOTIFICATION_SERVICE_PORT:-3313}:${GRPC_NOTIFICATION_SERVICE_PORT:-3313}'
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - nest-turbo-network

  project-service:
    container_name: nest_turbo_project_service
    build:
      context: .
      dockerfile: .docker/compose/nodejs/Dockerfile
      args:
        SERVICE: project-service
    ports:
      - '${PROJECT_SERVICE_APP_PORT:-3304}:${PROJECT_SERVICE_APP_PORT:-3304}'
    expose:
      - '${GRPC_PROJECT_SERVICE_PORT:-3314}'
    environment:
      GRPC_PROJECT_SERVICE_HOST: project-service
      GRPC_PROJECT_SERVICE_PORT: ${GRPC_PROJECT_SERVICE_PORT:-3314}
      LARK_INTEGRATION_ENCRYPTION_KEY: ${LARK_INTEGRATION_ENCRYPTION_KEY:?Set LARK_INTEGRATION_ENCRYPTION_KEY}
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - nest-turbo-network

  lark-bot-service:
    container_name: nest_turbo_lark_bot_service
    build:
      context: .
      dockerfile: .docker/compose/nodejs/Dockerfile
      args:
        SERVICE: lark-bot-service
    ports:
      - '${LARK_BOT_SERVICE_APP_PORT:-3305}:${LARK_BOT_SERVICE_APP_PORT:-3305}'
    environment:
      GRPC_PROJECT_SERVICE_HOST: project-service
      GRPC_PROJECT_SERVICE_PORT: ${GRPC_PROJECT_SERVICE_PORT:-3314}
      LARK_INTEGRATION_ENCRYPTION_KEY: ${LARK_INTEGRATION_ENCRYPTION_KEY:?Set LARK_INTEGRATION_ENCRYPTION_KEY}
    depends_on:
      - project-service
    networks:
      - nest-turbo-network

  web:
    container_name: nest_turbo_web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${APISIX_NODE_LISTEN}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
        CIRCLE_BUILD_REVISION: ${CIRCLE_BUILD_REVISION:-local}
    ports:
      - '3001:3001'
    depends_on:
      - apisix
    networks:
      - nest-turbo-network

  etcd:
    extends:
      file: .docker/compose/apisix/apisix.yml
      service: etcd
    container_name: nest_turbo_apisix_etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    command:
      - /usr/local/bin/etcd
      - --name
      - etcd
      - --data-dir
      - /etcd-data
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --advertise-client-urls
      - http://etcd:2379
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --initial-advertise-peer-urls
      - http://etcd:2380
      - --initial-cluster
      - etcd=http://etcd:2380
      - --initial-cluster-token
      - etcd-cluster
      - --initial-cluster-state
      - new
    networks:
      - nest-turbo-network
    volumes:
      - ./.docker/volumes/etcd-data:/etcd-data

  apisix:
    extends:
      file: .docker/compose/apisix/apisix.yml
      service: apisix
    container_name: nest_turbo_apisix
    environment:
      APISIX_PROFILE: ${APISIX_PROFILE}
    volumes:
      - ./config/apisix/conf/config-${APISIX_PROFILE}.yaml:/usr/local/apisix/conf/config-${APISIX_PROFILE}.yaml
      - ./config/apisix/conf/debug-${APISIX_PROFILE}.yaml:/usr/local/apisix/conf/debug-${APISIX_PROFILE}.yaml
    ports:
      - "${APISIX_NODE_LISTEN}:${APISIX_NODE_LISTEN}"
      - "${APISIX_DEPLOYMENT_ADMIN_LISTEN}:${APISIX_DEPLOYMENT_ADMIN_LISTEN}"
    depends_on:
      - etcd
    env_file:
      - .env
    networks:
      - nest-turbo-network
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  apisix-homepage:
    image: nginx:1.29-alpine
    volumes:
      - ./config/apisix/homepage/index-dev.html:/usr/share/nginx/html/index.html
    ports:
      - "${APISIX_HOMEPAGE_PORT}:80"

  adc:
    build:
      context: .
      dockerfile: ./.docker/compose/apisix/Dockerfile.adc
    container_name: nest_turbo_adc
    restart: 'no'
    networks:
      - nest-turbo-network
    depends_on:
      apisix:
        condition: service_started
    environment:
      ADC_BACKEND: apisix
      ADC_SERVER: http://apisix:${APISIX_DEPLOYMENT_ADMIN_LISTEN}
      ADC_TOKEN: ${APISIX_KEY}
    env_file:
      - .env
    volumes:
      - ./config/apisix:/work

volumes:
  redisinsight_data:
  kafka_data:
  kong_db_data:
  user_pgdata:
  redis_data:
  etcd-data:

networks:
  nest-turbo-network:
